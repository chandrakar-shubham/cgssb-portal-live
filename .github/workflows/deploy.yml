name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Type Check & Lint Codebase
        run: |
          npm run lint

      - name: Build Production Bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          npm run build

      - name: Verify Build Artifacts
        run: |
          echo "=== Verifying Build Artifacts in dist/ ==="
          test -f dist/index.html || { echo "❌ dist/index.html is missing"; exit 1; }
          test -f dist/server.cjs || { echo "❌ dist/server.cjs is missing"; exit 1; }
          test -f dist/server.js || { echo "❌ dist/server.js is missing"; exit 1; }
          test -f dist/.htaccess || { echo "❌ dist/.htaccess is missing"; exit 1; }
          test -f dist/tmp/restart.txt || { echo "❌ dist/tmp/restart.txt is missing"; exit 1; }
          echo "✅ All required build artifacts verified successfully!"
          cat dist/version.json

      - name: Check Hostinger FTP Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.HOSTINGER_FTP_SERVER }}" ] && [ -n "${{ secrets.HOSTINGER_FTP_USERNAME }}" ] && [ -n "${{ secrets.HOSTINGER_FTP_PASSWORD }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "✅ Hostinger FTP secrets are configured. Proceeding with FTP deployment."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Hostinger Secrets Not Configured::Hostinger FTP credentials (HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USERNAME, HOSTINGER_FTP_PASSWORD) are not yet set in GitHub repository secrets. Build artifacts were generated and verified successfully."
            echo "💡 To enable automatic FTP deployment:"
            echo "1. Go to your GitHub repository -> Settings -> Secrets and variables -> Actions."
            echo "2. Add HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USERNAME, and HOSTINGER_FTP_PASSWORD."
            echo "3. Optionally add HOSTINGER_SERVER_DIR (default: 'public_html/')."
          fi

      - name: Deploy to Hostinger via FTP
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR || 'public_html/' }}
          dangerous-clean-slate: false
          protocol: ftp
          log-level: verbose
          exclude: |
            data/**
            **/data/**
            **/.git*
            **/.git*/**

      - name: Post-Deploy Health Check
        if: steps.check_secrets.outputs.has_secrets == 'true'
        continue-on-error: true
        run: |
          echo "Checking live deployment at https://darkorange-chimpanzee-661223.hostingersite.com/api/version"
          sleep 5
          curl -sS --max-time 15 "https://darkorange-chimpanzee-661223.hostingersite.com/api/version" || echo "Live endpoint not directly reachable from runner or still starting"
