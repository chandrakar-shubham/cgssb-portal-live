name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Production Bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          npm run build
          # Ensure .htaccess from public/ is definitely present in dist/
          test -f dist/.htaccess || cp public/.htaccess dist/.htaccess 2>/dev/null || cp .htaccess dist/.htaccess 2>/dev/null || true
          # Provide runtime package.json in dist for Node.js manager
          node -e "const fs=require('fs'); const pkg=require('./package.json'); delete pkg.devDependencies; fs.writeFileSync('dist/package.json', JSON.stringify(pkg, null, 2))"
          # Ensure Passenger restart trigger is touched
          mkdir -p dist/tmp
          touch dist/tmp/restart.txt

      - name: Verify Build Artifacts
        run: |
          echo "=== Verifying Build Artifacts ==="
          test -f dist/index.html || { echo "❌ dist/index.html is missing"; exit 1; }
          test -f dist/server.cjs || { echo "❌ dist/server.cjs is missing"; exit 1; }
          test -f dist/server.js || { echo "❌ dist/server.js is missing"; exit 1; }
          test -f dist/.htaccess || { echo "❌ dist/.htaccess is missing"; exit 1; }
          test -f dist/tmp/restart.txt || { echo "❌ dist/tmp/restart.txt is missing"; exit 1; }
          ls -lh dist/assets/app-*.js || { echo "❌ dist/assets/app-*.js is missing"; exit 1; }
          echo "✅ All required build artifacts verified successfully!"
          cat dist/version.json

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR || 'public_html/' }}
          dangerous-clean-slate: false
          protocol: ftp
          log-level: verbose
          exclude: |
            data/**
            **/data/**
            **/.git*
            **/.git*/**

      - name: Post-Deploy Health Check
        continue-on-error: true
        run: |
          echo "Checking live deployment at https://darkorange-chimpanzee-661223.hostingersite.com/api/version"
          sleep 5
          curl -sS --max-time 15 "https://darkorange-chimpanzee-661223.hostingersite.com/api/version" || echo "Live endpoint not directly reachable from runner or still starting"
