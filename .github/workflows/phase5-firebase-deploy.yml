name: Phase 5 Firebase Spark Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize production releases so overlapping commits cannot overwrite each
# other's Hosting version between deploy and the release-commit smoke test.
concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: gen-lang-client-0783153446

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          set -e
          for attempt in 1 2 3; do
            if npm install --legacy-peer-deps --package-lock=false --no-audit --no-fund; then
              exit 0
            fi
            echo "npm install attempt $attempt failed; refreshing npm metadata before retry..."
            npm cache clean --force || true
            sleep 5
          done
          exit 1

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          NODE_ENV: production
        run: npm run build

      - name: Verify Spark artifacts
        run: |
          test -f dist/index.html
          test -f dist/version.json
          node -e "const p=require('./dist/version.json'); if(!p.commitSha||!p.buildTime) process.exit(1); if(!String(p.platform).includes('Spark')) process.exit(1); console.log(p)"

      - name: Configure Firebase authentication
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          printf '{"projects":{"default":"%s"}}\n' "$FIREBASE_PROJECT_ID" > .firebaserc

      - name: Deploy Firebase Hosting and Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          ./node_modules/.bin/firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting,firestore:rules --non-interactive

      - name: Smoke test deployed Firebase Hosting and verify release commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 https://gen-lang-client-0783153446.web.app/ -o /tmp/hosting-index.html; then
              if ! grep -qi '<html' /tmp/hosting-index.html; then
                echo "Hosting response did not contain an HTML document."
                exit 1
              fi
              curl -fsSL --max-time 20 https://gen-lang-client-0783153446.web.app/version.json -o /tmp/hosting-version.json
              node -e "const v=require('/tmp/hosting-version.json'); const expected=process.env.EXPECTED_COMMIT.slice(0,7); console.log('Deployed version:',v); if(v.commitSha!==expected){console.error('Expected commit '+expected+' but Hosting serves '+v.commitSha);process.exit(1)}"
              echo "Firebase Hosting serves the expected commit."
              exit 0
            fi
            sleep 5
          done
          echo "Firebase Hosting smoke test failed."
          exit 1

      - name: Check custom domain
        continue-on-error: true
        run: |
          if curl -fsSL --max-time 20 https://cgtest.in/ | grep -qi '<html'; then
            echo "cgtest.in is reachable."
          else
            echo "::warning::cgtest.in is not reachable from this runner yet; Firebase Hosting deployment itself is healthy."
          fi
