name: Phase 5 Firebase Spark Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: gen-lang-client-0783153446

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          set -e
          for attempt in 1 2 3; do
            if npm install --legacy-peer-deps --package-lock=false --no-audit --no-fund; then
              exit 0
            fi
            echo "npm install attempt $attempt failed; refreshing npm metadata before retry..."
            npm cache clean --force || true
            sleep 5
          done
          exit 1

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify Spark artifacts
        run: |
          test -f dist/index.html
          test -f dist/version.json
          node -e "const p=require('./dist/version.json'); if(!p.commitSha||!p.buildTime) process.exit(1); if(!String(p.platform).includes('Spark')) process.exit(1); console.log(p)"

      - name: Configure Firebase authentication
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          printf '{"projects":{"default":"%s"}}\n' "$FIREBASE_PROJECT_ID" > .firebaserc

      - name: Deploy Firebase Hosting and Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          ./node_modules/.bin/firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting,firestore:rules --non-interactive

      - name: Smoke test deployed Firebase Hosting
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 https://gen-lang-client-0783153446.web.app/ | grep -qi '<html'; then
              echo "Firebase Hosting smoke test passed."
              exit 0
            fi
            sleep 5
          done
          echo "Firebase Hosting smoke test failed."
          exit 1

      - name: Check custom domain
        continue-on-error: true
        run: |
          if curl -fsSL --max-time 20 https://cgtest.in/ | grep -qi '<html'; then
            echo "cgtest.in is reachable."
          else
            echo "::warning::cgtest.in is not reachable from this runner yet; Firebase Hosting deployment itself is healthy."
          fi
