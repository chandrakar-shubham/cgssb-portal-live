name: Phase 5 Firebase Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: gen-lang-client-0783153446

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify production artifacts
        run: |
          test -f dist/index.html
          test -f dist/firebase-functions.cjs
          test -f dist/server.js
          node -e "const p=require('./dist/version.json'); if(!p.commitSha||!p.buildTime) process.exit(1); console.log(p)"

      - name: Configure Firebase authentication
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          printf '{"projects":{"default":"%s"}}\n' "$FIREBASE_PROJECT_ID" > .firebaserc

      - name: Configure Firebase Functions secret
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          test -n "$ADMIN_SECRET"
          firebase functions:secrets:set ADMIN_SECRET --project "$FIREBASE_PROJECT_ID" --force <<< "$ADMIN_SECRET"

      - name: Deploy Firebase Hosting, Functions and Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting,functions,firestore:rules --non-interactive
