name: CGSSB Content Manager MCP CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mcp/cgssb-content-manager/**'
      - '.github/workflows/content-manager-mcp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp/cgssb-content-manager/**'
      - '.github/workflows/content-manager-mcp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp/cgssb-content-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
