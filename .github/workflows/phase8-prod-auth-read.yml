name: Phase 8 Authenticated Production Read Gate

on:
  workflow_dispatch:
    inputs:
      vus:
        description: "Virtual users"
        required: true
        default: "100"
      duration_sec:
        description: "Duration in seconds"
        required: true
        default: "60"

jobs:
  authenticated-production-read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run authenticated production READ gate
        env:
          PHASE8_PROD_PROJECT_ID: ${{ secrets.PHASE8_PROD_PROJECT_ID }}
          PHASE8_PROD_API_KEY: ${{ secrets.PHASE8_PROD_API_KEY }}
          PHASE8_PROD_TEST_USERS_JSON: ${{ secrets.PHASE8_PROD_TEST_USERS_JSON }}
          PHASE8_PROD_DATABASE_ID: ai-studio-cgssbtest-ed944dbb-7a88-46c1-8fe0-4ad38fcd1089
          VUS: ${{ inputs.vus }}
          DURATION_SEC: ${{ inputs.duration_sec }}
          THINK_MIN_MS: 700
          THINK_MAX_MS: 1400
        run: node scripts/phase8-prod-auth-read-gate.mjs
