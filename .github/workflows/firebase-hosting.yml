name: Deploy to Firebase Spark Hosting

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Build Production Bundle
        run: npm run build
      - name: Configure Firebase authentication
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          TARGET_PROJECT="$FIREBASE_PROJECT_ID"
          if [ -z "$TARGET_PROJECT" ]; then
            TARGET_PROJECT=$(node -e 'const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT); console.log(sa.project_id||"")')
          fi
          test -n "$TARGET_PROJECT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          printf '{"projects":{"default":"%s"}}\n' "$TARGET_PROJECT" > .firebaserc
      - name: Deploy Hosting and Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: ./node_modules/.bin/firebase deploy --only hosting,firestore:rules --project "$(node -p "require('./.firebaserc').projects.default")" --non-interactive
