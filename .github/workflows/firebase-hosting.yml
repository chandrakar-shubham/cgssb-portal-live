name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Production Bundle
        run: npm run build

      - name: Deploy to Firebase Hosting & Rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: gen-lang-client-0783153446
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Authenticating via Firebase Service Account..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            npx firebase-tools deploy --only hosting,firestore:rules --project "$PROJECT_ID"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Authenticating via Firebase CI Token..."
            npx firebase-tools deploy --only hosting,firestore:rules --token "$FIREBASE_TOKEN" --project "$PROJECT_ID"
          else
            echo "::error::Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_TOKEN secret was found in GitHub repository secrets!"
            exit 1
          fi
