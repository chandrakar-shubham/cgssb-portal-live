name: Phase 8 Runner Calibration

on:
  workflow_dispatch:
    inputs:
      vus:
        description: "Calibration virtual users"
        required: true
        default: "3500"
      duration_sec:
        description: "Calibration duration in seconds"
        required: true
        default: "60"

concurrency:
  group: phase8-runner-calibration
  cancel-in-progress: false

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run static-endpoint calibration (diagnostic only)
        env:
          BASE_URL: https://gen-lang-client-0783153446.web.app
          VUS: ${{ inputs.vus }}
          DURATION_SEC: ${{ inputs.duration_sec }}
          PATHS: /robots.txt
          THINK_MIN_MS: 700
          THINK_MAX_MS: 1400
          TIMEOUT_MS: 10000
          RUN_ID: phase8-calibration-${{ github.run_id }}
          RESULT_FILE: phase8-calibration-result.json
        run: |
          set +e
          node scripts/phase8-load-test.mjs
          calibration_exit_code=$?
          printf '%s\n' "$calibration_exit_code" > phase8-calibration-exit-code.txt
          echo "Calibration harness exit code: $calibration_exit_code"
          echo "This workflow is diagnostic-only; a non-zero harness acceptance result must not fail the workflow."
          exit 0

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-runner-calibration-${{ github.run_id }}
          path: |
            phase8-calibration-result.json
            phase8-calibration-exit-code.txt
          if-no-files-found: error
          retention-days: 30
