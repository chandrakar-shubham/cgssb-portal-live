name: Phase 8 External Read Load

on:
  workflow_dispatch:
    inputs:
      vus:
        description: "Virtual users"
        required: true
        default: "3500"
      duration_sec:
        description: "Duration in seconds"
        required: true
        default: "60"

concurrency:
  group: phase8-external-read-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run read-only load test
        env:
          BASE_URL: https://gen-lang-client-0783153446.web.app
          VUS: ${{ github.event_name == 'workflow_dispatch' && inputs.vus || '1500' }}
          DURATION_SEC: ${{ github.event_name == 'workflow_dispatch' && inputs.duration_sec || '60' }}
          RUN_ID: phase8-${{ github.run_id }}
          RESULT_FILE: phase8-load-result.json
          PATHS: /,/cgvyapam/mock-tests,/cgpsc/mock-tests,/leaderboard,/cgvyapam/pyp-papers,/cgvyapam-cgssb/chapter-tests,/cgvyapam-cgssb/practice-drills
          THINK_MIN_MS: 700
          THINK_MAX_MS: 1400
        run: node scripts/phase8-load-test.mjs
      - name: Upload load-test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-load-result-${{ github.run_id }}
          path: phase8-load-result.json
          if-no-files-found: error
          retention-days: 30




