name: Phase 8 External Read Load

on:
  push:
    paths:
      - ".github/workflows/phase8-load.yml"
  workflow_dispatch:
    inputs:
      vus:
        description: "Virtual users"
        required: true
        default: "1000"
      duration_sec:
        description: "Duration in seconds"
        required: true
        default: "120"

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run read-only load test
        env:
          BASE_URL: https://gen-lang-client-0783153446.web.app
          VUS: ${{ github.event_name == 'workflow_dispatch' && inputs.vus || '100' }}
          DURATION_SEC: ${{ github.event_name == 'workflow_dispatch' && inputs.duration_sec || '60' }}
        run: node scripts/phase8-load-test.mjs

# Phase 8 execution marker: rerun 100-VU load after stack-safe aggregation fix.

# Phase 8 execution marker: run 250-VU read-only load.

# Phase 8 execution marker: run 500-VU read-only load.

# Phase 8 execution marker: run 1000-VU read-only load.
