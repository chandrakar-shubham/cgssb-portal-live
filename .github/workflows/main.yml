name: CI Build Integrity & Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual verification reason'
        required: false
        default: 'Pre-deployment verification'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Integrity Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          set -e
          for attempt in 1 2 3; do
            if npm install --legacy-peer-deps --package-lock=false --no-audit --no-fund; then
              exit 0
            fi
            echo "npm install attempt $attempt failed; refreshing npm cache before retry..."
            npm cache clean --force || true
            sleep 5
          done
          exit 1

      - name: 🛡️ Firestore Security Rules Regression Tests
        run: npx tsx scripts/firestore-rules.test.ts

      - name: 🧪 Phase 8.5 Student Journey Safety Guard
        run: npm run test:phase8:5-journey-guard

      - name: 🔍 Static Type Check & Linting
        run: |
          echo "Running TypeScript strict verification (tsc --noEmit)..."
          npm run lint

      - name: 🏗️ Execute Production Bundle Build
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          NODE_ENV: production
        run: |
          echo "Compiling Firebase Spark client frontend..."
          npm run build

      - name: 🛡️ Verify Production Artifacts Integrity
        run: |
          echo "Checking essential deployment artifacts..."
          test -f dist/index.html || { echo "❌ dist/index.html is missing!"; exit 1; }
          test -f dist/version.json || { echo "❌ dist/version.json is missing!"; exit 1; }
          
          echo "✅ All required production artifacts verified successfully!"
          ls -la dist/

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build-dist-${{ github.sha }}
          path: dist/
          retention-days: 7
