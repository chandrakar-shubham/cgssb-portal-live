name = "cgssb-trusted-scoring"
main = "src/index.mjs"
compatibility_date = "2026-10-27"
workers_dev = true

[vars]
# Set this to the exact Firebase project ID for the target environment.
# Never use a production project ID for local synthetic tests by accident.
FIREBASE_PROJECT_ID = "REPLACE_WITH_NON_PRODUCTION_FIREBASE_PROJECT_ID"

# Configure the exact non-production Firestore database ID before any adapter wiring.
# This project has used a named database; do not assume "(default)".
FIRESTORE_DATABASE_ID = "REPLACE_WITH_NON_PRODUCTION_DATABASE_ID"
